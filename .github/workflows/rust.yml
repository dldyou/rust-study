name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.project }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - guess-number
          - how2use-testcode
          - rust-grammer
          - test-game-engine

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: ${{ matrix.project }}
        run: cargo build --verbose

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: cargo test --verbose
